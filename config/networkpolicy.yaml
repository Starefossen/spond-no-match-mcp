apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: spond
  namespace: mcp
spec:
  description: "Allow spond MCP traffic from Kourier, to Spond API"
  endpointSelector:
    matchLabels:
      serving.knative.dev/service: spond

  ingress:
    # Allow traffic from Kourier (Knative ingress)
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kourier-system
            app: 3scale-kourier-gateway
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

    # Allow traffic from Knative activator (health probes & scale-from-zero)
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: knative-serving
            app: activator
      toPorts:
        - ports:
            - port: "8012"
              protocol: TCP
            - port: "8080"
              protocol: TCP

    # Allow metrics scraping from Knative autoscaler (required for scale-to-zero)
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: knative-serving
            app: autoscaler
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP

  egress:
    # Allow DNS resolution
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchPattern: "*"

    # Allow HTTPS to Spond API
    - toFQDNs:
        - matchName: "api.spond.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

    # Alerts on Spond login failure
    - toFQDNs:
        - matchName: "ntfy.sh"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

    # Kanidm JWKS for mcpauth JWTs (RFC-019 phase 2); LB 192.168.40.45:443 DNATs to pod 8443
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kanidm
            app: kanidm
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
